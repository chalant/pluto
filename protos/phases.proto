syntax = "proto3";

import "google/protobuf/timestamp.proto";

import "protos/clock.proto";
import "protos/broker.proto";

// Payloads of the phase topics of a simulated run (pluto/control/phases.py).
// The trade phase carries a ClockEvent, the submit phase a SubmitEvent.

// phase.book and phase.metrics: the signal of one calendar at a tick
message SignalEvent {
    google.protobuf.Timestamp timestamp = 1;  // clock time of the tick
    Signal signal = 2;                        // calendar time, event, calendar name
    repeated AssetPrice last_sale_prices = 3; // of the calendar (phase.book)
}

// phase.account: the tick, with the last sale prices of every calendar
message AccountEvent {
    ClockEvent clock = 1;
    repeated AssetPrice last_sale_prices = 2;
}

// what a runtime announced in its trade done: the orders and batches of orders it sent in the tick
message RuntimeOrders {
    string participant = 1;
    uint32 orders = 2;
    uint32 batches = 3;
}

// phase.submit: the tick, with what every runtime announced in its trade done and the controller saw arrive in the log
message SubmitEvent {
    ClockEvent clock = 1;
    repeated RuntimeOrders runtimes = 2;      // in the order the controller expects the runtimes (registration order)
}

// phase.done: a participant has finished its work of a phase
message PhaseDone {
    string phase = 1;              // topic of the phase event
    string participant = 2;
    uint32 orders = 3;             // trade phase: the number of orders the runtime sent
    uint32 batches = 4;            // trade phase: the number of batches of orders it sent (a batch may be empty)
    string error = 5;              // set when the participant failed in the phase
}
