syntax = "proto3";

import "google/protobuf/timestamp.proto";
import "protos/assets.proto";

message Order {
    string id = 1;
    google.protobuf.Timestamp dt = 2;
    string reason = 3;
    google.protobuf.Timestamp created = 4;
    Asset asset = 5;
    double amount = 6;
    double filled = 7;
    double commission = 8;
    enum Status {
        OPEN = 0;
        FILLED = 1;
        CANCELED = 2;
        REJECTED = 3;
        HELD = 4;
    }
    Status status = 14;
    message Stop {
        bool is_set = 1;
        double value = 2;
    }
    message Limit {
        bool is_set = 1;
        double value = 2;
    }
    Stop stop = 9;
    Limit limit = 10;
    bool stop_reached = 11;
    bool limit_reached = 12;
    int64 broker_order_id = 13;
    string session_id = 15;
}

message Position {
    Asset asset = 1;
    double amount = 2;
    double cost_basis = 3;
    double last_sale_price = 4;
    google.protobuf.Timestamp last_sale_date = 5;
}

message Account {
    //todo: add fields for commodities...
    double settled_cash = 1;
    double accrued_interest = 2;
    double buying_power = 3;
    double equity_with_loan = 4;
    double total_positions_value = 5;
    double total_positions_exposure = 6;
    double regt_equity = 7;
    double regt_margin = 8;
    double initial_margin_requirement = 9;
    double maintenance_margin_requirement = 10;
    double available_funds = 11;
    double excess_liquidity = 12;
    double cushion = 13;
    double day_trades_remaining = 14;
    double leverage = 15;
    double net_leverage = 16;
    double net_liquidation = 17;
    double sma = 18;
}

message Portfolio {
    double cash_flow = 1;
    double starting_cash = 2;
    double portfolio_value = 3;
    double pnl = 4;
    double returns = 5;
    double cash = 6;
    google.protobuf.Timestamp start_date = 7;
    double positions_value = 8;
    double positions_exposure = 9;
}

message Positions {
    repeated AssetPositionPair positions = 1;
}

message AssetPositionPair {
    Asset key = 1;
    Position position = 2;
}