syntax = "proto3";

import "protos/protocol.proto";
import "google/protobuf/timestamp.proto";


message LedgerState {
    Portfolio portfolio = 1;
    Account account = 2;
    google.protobuf.Timestamp last_checkpoint = 3;
    repeated Order orders = 4;
    google.protobuf.Timestamp first_session = 5;
    repeated Return daily_returns = 6;
    int32 session_count = 7;
    repeated Position positions = 8;
    // format of the saved state (pluto.finance.ledger.STATE_VERSION); 0
    // (absent): written by the modules with 32-bit fields, which these
    // modules cannot read (their float values parse as unknown fields);
    // 1: without stream_sequence (read as 0)
    uint32 version = 9;
    // sequence number of the last event of the book's stream (broker service)
    // folded into this state; 0: none
    uint64 stream_sequence = 10;
}

message Return {
    google.protobuf.Timestamp timestamp = 1;
    double value = 2;
}