syntax = 'proto3';

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "protos/broker.proto";
import "protos/clock.proto";
import "protos/data.proto";
import "protos/structs.proto";


service Controllable {
    /*A service that is called by a controller*/
    rpc UpdateParameters (ParametersUpdateRequest) returns (google.protobuf.Empty);
    rpc Initialize (RunSetup) returns (InitializeResponse);
    rpc Run (RunRequest) returns (google.protobuf.Empty);
    rpc ClockUpdate (ClockEvent) returns (google.protobuf.Empty);
    //sends broker state
    rpc UpdateAccount (stream Chunk) returns (google.protobuf.Empty);
    rpc Stop (StopRequest) returns (google.protobuf.Empty);

    rpc Watch (google.protobuf.Empty) returns (google.protobuf.Empty);
    rpc StopWatching (google.protobuf.Empty) returns (google.protobuf.Empty);
}

message RunSetup {
    string strategy_id = 1;

}

message InitializeResponse {
    string data_frequency = 1;
    bool shorting = 3;
    string asset_classes = 4;
    bool fractional = 5;
}

message EngineSetup{
    map<string, Data> commission_models = 1;
    map<string, Data> slippage_models = 2;
    map<string, Data> tax_models = 3;
}


message RunRequest {
    string id = 1;
    string session_id = 2;

    float capital = 3;
    float leverage = 4;

    google.protobuf.Timestamp start = 5;
    google.protobuf.Timestamp end = 6;

    EngineSetup engine_setup = 7;

    string universe_name = 8;

    bool clear_perf = 9; // clear performance log file

}

message StopRequest {
    string session_id = 1;
    bool liquidate = 2;
    google.protobuf.Timestamp real_ts = 3;
}

message UpdateRequest {
    google.protobuf.Timestamp timestamp = 1;
    EventType event = 2;
    BrokerState broker_state = 3;
}

message UpdateReply {

}

message ControllableState {
    string session_id = 1;
    string session_state = 2;
    float capital = 3;
    float max_leverage = 11;
    string universe = 4;
    int32 look_back = 5;
    string data_frequency = 6;
    google.protobuf.Timestamp start = 7;
    google.protobuf.Timestamp end = 8;
    google.protobuf.Timestamp checkpoint = 9;
    bytes metrics_tracker_state = 10;
}

message ParametersUpdateRequest {
    float capital = 1;
    float maximum_leverage = 2;
}