syntax = "proto3";

message Field {
    // type determines how we should deserialize the value
    bool is_primitive = 1;
    string type = 2;
    string name = 3;
    bytes value = 4;
}

message Struct {
    string name = 1;
    repeated Field fields = 2;
}

message Primitive {
    string type = 1;
    string value = 2;
}

message Data {
    bool is_primitive = 1;
    bytes value = 2;
}