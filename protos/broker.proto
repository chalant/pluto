syntax = "proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

import "protos/protocol.proto";
import "protos/assets.proto";
import "protos/finance.proto";
import "protos/data.proto";

service Broker {
    /*This is an interface that provides brokerage access to clients. It encapsulates
    methods for accessing performing trades. Each caller passes its credentials as metadata*/
    rpc PlaceOrders (stream Chunk) returns (google.protobuf.Empty);
    rpc Stopped(google.protobuf.Empty) returns (google.protobuf.Empty);
    rpc CancelOrder (CancelRequest) returns (google.protobuf.Empty);
    rpc CancelAllOrdersForAsset (Asset) returns (google.protobuf.Empty);
//    rpc ExecuteCancelPolicy (CancelEvent) returns (google.protobuf.Empty);
    rpc SetWatchList(stream Chunk) returns (google.protobuf.Empty);
}

message WatchList {
    google.protobuf.Timestamp ts = 1;
    repeated Asset assets = 2;
}

message AssetPrice {
    uint32 sid = 1;
    float price = 2;
}

message BrokerState {
    repeated TransactionCommission transactions = 1;
    Account account = 2;
    google.protobuf.Timestamp timestamp = 3;
    uint32 not_running = 4;
    repeated AssetPrice last_sale_prices = 5;
}

message TransactionCommission {
    Transaction transaction = 1;
    float commission = 2;
}

message OrderBatch {
    google.protobuf.Timestamp ts = 1;
    repeated Order orders = 2;
    bool ended = 3;
    Portfolio portfolio = 4;
    Positions positions = 5;
}

message Commission {
    Asset asset = 1;
    Order order = 2;
    float cost = 3;
}

message WarningMessage {
    string message = 1;
}

message OrderParams {
    string style = 1;
    Asset asset = 2;
    float amount = 3;
    float limit_price = 4;
    float stop_price = 5;
    float limit_order = 6;
    float exchange = 7;
    google.protobuf.Timestamp order_dt = 8;
}

message CancelRequest {
    string order_id = 1;
}

