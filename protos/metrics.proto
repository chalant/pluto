syntax = "proto3";

import "google/protobuf/timestamp.proto";

import "protos/finance.proto";
import "protos/protocol.proto";

message CumulativeMetrics {
    google.protobuf.Timestamp period_open = 1;
    google.protobuf.Timestamp period_close = 2;
    double returns = 3;
    double pnl = 4;
    double capital_used = 5; //capital_used
    double starting_exposure = 6;
    double ending_exposure = 7;
    double starting_value = 8;
    double ending_value = 9;
    double starting_cash = 10;
    double ending_cash = 11;
    double portfolio_value = 20;
    int64 longs_count = 12;
    int64 shorts_count = 13;
    double long_value = 14;
    double short_value = 15;
    double long_exposure = 16;
    double short_exposure = 17;
    double gross_leverage = 18;
    double net_leverage = 19;
}

message PeriodMetrics {
    repeated Order orders = 1;
    repeated Transaction transactions = 2;
    repeated Position positions = 3;
    google.protobuf.Timestamp period_open = 4;
    google.protobuf.Timestamp period_close = 5;
    double capital_used = 6;
    double starting_exposure = 7;
    double ending_exposure = 8;
    double starting_value = 9;
    double starting_cash = 10;
    double returns = 11;
    double pnl = 12;
}

message CumulativeRiskMetrics {
    double algo_volatility = 1;
//    double benchmark_period_return = 2;
//    double benchmark_volatility = 3;
    double algorithm_period_return = 2;
//    double alpha = 5;
//    double beta = 6;
//    double sharpe = 7;
//    double sortino = 8;
//    double max_drawdown = 9;
    double max_leverage = 3;
    int32 trading_days = 4;
    string period_label = 5;
    double excess_return = 6;
    double treasury_period_return = 7;
}